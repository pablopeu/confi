<!DOCTYPE html>
<html lang="es" class="">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PEU Cuchillos — Catálogo</title>
<style>
  :root {
    --bg: #f9fafb;
    --surface: #fff;
    --border: #e5e7eb;
    --text: #111827;
    --muted: #6b7280;
    --accent: #2563ef;
    --chip-bg: #f3f4f6;
    --chip-active: #dbeafe;
    --chip-border: #d1d5db;
    --shadow: 0 1px 3px 0 rgb(0 0 0 / .1), 0 1px 2px -1px rgb(0 0 0 / .1);
    --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / .1), 0 4px 6px -4px rgb(0 0 0 / .1);
  }
  .dark {
    --bg: #111827;
    --surface: #1f2937;
    --border: #374151;
    --text: #f3f4f6;
    --muted: #9ca3af;
    --accent: #3b82f6;
    --chip-bg: #374151;
    --chip-active: #1e3a5f;
    --chip-border: #4b5563;
    --shadow: 0 1px 3px 0 rgb(0 0 0 / .3), 0 1px 2px -1px rgb(0 0 0 / .2);
    --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / .3), 0 4px 6px -4px rgb(0 0 0 / .2);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;
    background:var(--bg);color:var(--text);
    min-height:100vh;line-height:1.5;
    transition:background .2s,color .2s;
  }

  /* ── Header ── */
  header{background:var(--surface);border-bottom:1px solid var(--border);box-shadow:var(--shadow);position:sticky;top:0;z-index:40;transition:background .2s,border-color .2s}
  .hdr{max-width:1280px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;justify-content:space-between}
  .hdr-l{display:flex;align-items:center;gap:12px;min-width:0}
  .hdr-l img.logo{height:32px;object-fit:contain}
  .dark .hdr-l img.logo{filter:brightness(0) invert(1)}
  .hdr-l h1{font-size:1rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hdr-l p{font-size:.7rem;color:var(--muted)}
  .hdr-r{display:flex;align-items:center;gap:8px}
  .btn-icon{padding:6px;border-radius:8px;background:transparent;border:none;color:var(--muted);cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center}
  .btn-icon:hover{background:var(--chip-bg);color:var(--text)}
  .btn-icon svg{width:20px;height:20px}

  .main{max-width:1280px;margin:0 auto;padding:12px 16px 120px}

  /* ── Breadcrumb (compact text-only) ── */
  .crumb-line{display:flex;flex-wrap:wrap;align-items:center;gap:3px;font-size:.75rem;color:var(--muted);margin-bottom:10px;min-height:20px;line-height:1.3}
  .crumb-line .sep{color:var(--border);margin:0 2px}
  .crumb-line a{color:var(--muted);text-decoration:none;cursor:pointer;transition:color .12s;white-space:nowrap}
  .crumb-line a:hover{color:var(--accent);text-decoration:underline}
  .crumb-line a.here{color:var(--text);font-weight:500;cursor:default}
  .crumb-line a.here:hover{text-decoration:none}
  .crumb-line .x{font-size:.65rem;margin-left:2px;opacity:.5}

  /* ── Chip rows ── */
  .chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .chip{padding:6px 14px;border-radius:8px;font-size:.83rem;background:var(--chip-bg);border:1px solid var(--chip-border);color:var(--text);cursor:pointer;transition:all .15s;white-space:nowrap;user-select:none;display:inline-flex;align-items:center;gap:6px}
  .chip:hover{border-color:var(--accent);background:var(--surface)}
  .chip.sel{background:var(--chip-active);border-color:var(--accent);color:var(--accent);font-weight:500}
  .chip .n{font-size:.65rem;background:var(--surface);color:var(--muted);padding:1px 6px;border-radius:99px;border:1px solid var(--border)}
  .chip.sel .n{background:var(--surface);color:var(--accent);border-color:var(--accent)}

  /* ── Status ── */
  .status{font-size:.78rem;color:var(--muted);margin:6px 0}

  /* ── Photos ── */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s}
  .card:hover{border-color:var(--accent);box-shadow:var(--shadow-lg)}
  .card-img{width:100%;aspect-ratio:4/3;background:var(--chip-bg);display:flex;align-items:center;justify-content:center;overflow:hidden}
  .card-img img{width:100%;height:100%;object-fit:cover}
  .card-img .no{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .card-tags{padding:10px 12px;display:flex;flex-wrap:wrap;gap:4px}
  .card-tags span{font-size:.66rem;padding:2px 8px;border-radius:4px;background:var(--chip-bg);color:var(--muted);border:1px solid var(--border)}

  /* ── Fullsize modal ── */
  .fs-bg{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .fs-bg.light{background:rgba(255,255,255,.86)}
  .fs-bg.dark{background:rgba(0,0,0,.86)}
  .fs-bg img{max-width:90vw;max-height:90vh;object-fit:contain;border:4px solid var(--surface);border-radius:6px;box-shadow:0 0 0 1px var(--border),0 20px 60px rgba(0,0,0,.3)}

  /* ── Footer (match confi exactly) ── */
  footer{background:var(--surface);border-top:1px solid var(--border);position:fixed;bottom:0;left:0;right:0;z-index:30;transition:background .2s,border-color .2s}
  .ft{max-width:1280px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
  .ft-soc{display:flex;align-items:center;gap:12px}
  .ft-soc span{font-size:.875rem;color:var(--muted)}
  .ft-soc a{display:flex;transition:all .15s}
  .ft-soc a:hover{transform:scale(1.15)}
  .ft-soc a svg{width:24px;height:24px}
  .ft-soc a.ig{color:#db2777}.dark .ft-soc a.ig{color:#ec4899}
  .ft-soc a.ig:hover{color:#be185d}.dark .ft-soc a.ig:hover{color:#f472b6}
  .ft-soc a.tw{color:#111827}.dark .ft-soc a.tw{color:#f3f4f6}
  .ft-soc a.tw:hover{color:#374151}.dark .ft-soc a.tw:hover{color:#d1d5db}
  .ft-soc a.fb{color:#2563eb}.dark .ft-soc a.fb{color:#3b82f6}
  .ft-soc a.fb:hover{color:#1d4ed8}.dark .ft-soc a.fb:hover{color:#60a5fa}
  .ft-soc a.wa{color:#16a34a}.dark .ft-soc a.wa{color:#22c55e}
  .ft-soc a.wa:hover{color:#15803d}.dark .ft-soc a.wa:hover{color:#4ade80}
  .ft-soc a.tg{color:#0891b2}.dark .ft-soc a.tg{color:#22d3ee}
  .ft-soc a.tg:hover{color:#0e7490}.dark .ft-soc a.tg:hover{color:#67e8f9}
  .ft-btn{padding:6px 16px;background:#2563eb;color:#fff;border-radius:8px;font-size:.875rem;font-weight:500;text-decoration:none;transition:background .15s;white-space:nowrap}
  .ft-btn:hover{background:#1d4ed8}

  /* ── Floating ── */
  .fl{position:fixed;bottom:72px;right:16px;display:flex;flex-direction:column;gap:10px;z-index:99}
  .fb{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;box-shadow:var(--shadow-lg);transition:transform .15s;position:relative}
  .fb:hover{transform:scale(1.12)}
  .fb svg{width:20px;height:20px;fill:#fff}
  .fb.h{background:#1f2937}
  .fb.t{background:#0088cc}
  .fb.w{background:#25D366}
  .fb .ring{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  @keyframes ds{0%{stroke-dashoffset:163.36}100%{stroke-dashoffset:-163.36}}
  @keyframes fo{0%{opacity:1}100%{opacity:0}}
  .fb .ring circle{fill:none;stroke:#facc15;stroke-width:4;stroke-linecap:round;stroke-dasharray:163.36;stroke-dashoffset:163.36;animation:ds 1.5s ease-out forwards,fo .5s ease-out 2s forwards}

  /* ── Instructions modal ── */
  .mo{position:fixed;inset:0;z-index:110;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px}
  .mc{background:var(--surface);border-radius:12px;box-shadow:var(--shadow-lg);max-width:560px;width:100%;max-height:90vh;overflow-y:auto;padding:24px;cursor:default}
  .mc h1{font-size:1.3rem;font-weight:700;margin:6px 0 10px}
  .mc h2{font-size:1.1rem;font-weight:700;margin:16px 0 6px}
  .mc h3{font-size:1rem;font-weight:600;margin:12px 0 4px}
  .mc p{margin:6px 0;font-size:.9rem;color:var(--muted)}
  .mc ul{list-style:disc;padding-left:24px;margin:6px 0}
  .mc li{font-size:.85rem;color:var(--muted);margin:3px 0}
  .mc a{color:var(--accent)}
  .mc strong{color:var(--text)}
  .mc hr{border:none;border-top:1px solid var(--border);margin:12px 0}

  /* ── Toast ── */
  .toast{position:fixed;bottom:140px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);padding:8px 20px;border-radius:999px;font-size:.8rem;color:var(--text);box-shadow:var(--shadow-lg);z-index:120;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
  .toast.on{opacity:1}

  @media(max-width:640px){
    .main{padding:10px 12px 110px}
    .grid{grid-template-columns:1fr}
    .ft-soc span{display:none}
    .ft{padding:10px 12px}
    .fl{bottom:64px;right:12px}
    .fb{width:40px;height:40px}.fb svg{width:18px;height:18px}
    .hdr-l img.logo{height:26px}
    .hdr-l h1{font-size:.9rem}
  }
  @media(min-width:641px){
    .fl{bottom:72px;right:24px}
    .fb{width:52px;height:52px}.fb svg{width:24px;height:24px}
  }
</style>
</head>

var S={tipo:null,estilo:null,ag:null,acero:null,encabado:null};
var LV=[
  {k:'tipo',    lab:'Tipo',     get:gt},
  {k:'estilo',  lab:'Estilo',   get:ge},
  {k:'ag',      lab:'Acero',    get:gag},
  {k:'acero',   lab:'',         get:ga},
  {k:'encabado',lab:'Encabado', get:gh}
];

function ci(n,ids){if(Array.isArray(n)){n.forEach(function(id){ids.add(id)});return}Object.values(n).forEach(function(v){ci(v,ids)})}

function gt(){return Object.entries(TREE).map(function(e){var ids=new Set();ci(e[1],ids);return{k:e[0],l:e[0],n:ids.size}}).sort(function(a,b){return b.n-a.n})}

function ge(){if(!S.tipo||!TREE[S.tipo])return[];var n=TREE[S.tipo];return Object.entries(n).map(function(e){var ids=new Set();ci(e[1],ids);return{k:e[0],l:e[0],n:ids.size}}).sort(function(a,b){if(a.k==='Vaina Cincelada')return 1;if(b.k==='Vaina Cincelada')return -1;return b.n-a.n})}

function gag(){if(!S.estilo||!TREE[S.tipo]||!TREE[S.tipo][S.estilo])return[];var n=TREE[S.tipo][S.estilo];var o={'Acero inoxidable':1,'Acero carbono':2,'Acero damasco':3,'Otros':4};return Object.entries(n).map(function(e){var ids=new Set();ci(e[1],ids);return{k:e[0],l:e[0],n:ids.size}}).sort(function(a,b){return(o[a.k]||99)-(o[b.k]||99)})}

function ga(){if(!S.ag||!TREE[S.tipo]||!TREE[S.tipo][S.estilo])return[];var ng=TREE[S.tipo][S.estilo];if(!ng[S.ag])return[];return Object.entries(ng[S.ag]).map(function(e){return{k:e[0],l:e[0],n:Object.keys(e[1]||{}).length}}).sort(function(a,b){return b.n-a.n})}

function gh(){if(!S.acero||!TREE[S.tipo]||!TREE[S.tipo][S.estilo])return[];var ng=TREE[S.tipo][S.estilo];if(!ng[S.ag]||!ng[S.ag][S.acero])return[];return Object.entries(ng[S.ag][S.acero]).map(function(e){return{k:e[0],l:e[0],n:e[1].length}}).sort(function(a,b){return b.n-a.n})}

function match(){
  var n=TREE;if(!S.tipo||!n[S.tipo])return[];n=n[S.tipo];
  if(!S.estilo){var ids=new Set();ci(n,ids);return Array.from(ids)}if(!n[S.estilo])return[];n=n[S.estilo];
  if(!S.ag){var ids=new Set();ci(n,ids);return Array.from(ids)}if(!n[S.ag])return[];n=n[S.ag];
  if(!S.acero){var ids=new Set();ci(n,ids);return Array.from(ids)}if(!n[S.acero])return[];n=n[S.acero];
  if(!S.encabado){var ids=new Set();ci(n,ids);return Array.from(ids)}return n[S.encabado]||[];
}

// Which level to show chips for
function showLevel(){
  if(!S.tipo)return 0;
  if(!S.estilo)return 1;
  if(!S.ag)return 2;
  if(!S.acero)return 3;
  return 4;
}

// ── Breadcrumb (compact text) ──
function mkCrumb(){
  var el=document.getElementById('crumbLine');
  var parts=[];
  for(var i=0;i<LV.length;i++){
    var v=S[LV[i].k];if(!v)break;
    var lab=LV[i].lab||v;
    parts.push({label:lab,key:LV[i].k,val:v,last:i===showLevel()-1});
  }
  if(!parts.length){el.innerHTML='';return}
  var h='';
  for(var i=0;i<parts.length;i++){
    if(i>0)h+='<span class="sep">/</span>';
    if(parts[i].last){
      h+='<a class="here">'+parts[i].val+'</a>';
    }else{
      h+='<a data-r="'+parts[i].key+'">'+parts[i].label+': '+parts[i].val+'<span class="x">\u00d7</span></a>';
    }
  }
  el.innerHTML=h;
  el.querySelectorAll('a[data-r]').forEach(function(a){
    a.onclick=function(){resetTo(this.dataset.r)};
  });
}

function resetTo(lk){
  var f=false;
  for(var i=0;i<LV.length;i++){
    if(LV[i].k===lk){f=true;S[LV[i].k]=null;continue}
    if(f)S[LV[i].k]=null;
  }
  if(lk==='tipo')S={tipo:null,estilo:null,ag:null,acero:null,encabado:null};
  up();
}

// ── Sections ──
function mkSecs(){
  var sl=showLevel();
  var cont=document.getElementById('secs');
  var ids=['tipo','estilo','ag','acero','encabado'];
  var gets=[gt,ge,gag,ga,gh];
  var sels=[S.tipo,S.estilo,S.ag,S.acero,S.encabado];

  var items=gets[sl]();
  if(!items.length){cont.innerHTML='';return}

  cont.innerHTML='<div class="chip-row">'+items.map(function(it){
    var cs=it.k===sels[sl]?' sel':'';
    return '<span class="chip'+cs+'" data-k="'+it.k+'">'+it.l+'<span class="n">'+it.n+'</span></span>';
  }).join('')+'</div>';

  cont.querySelectorAll('.chip').forEach(function(ch){
    ch.onclick=function(){pick(sl,this.dataset.k)};
  });
}

function pick(lv,key){
  var ks=['tipo','estilo','ag','acero','encabado'];
  if(lv===0){
    if(S.tipo===key)S={tipo:null,estilo:null,ag:null,acero:null,encabado:null};
    else S={tipo:key,estilo:null,ag:null,acero:null,encabado:null};
  }else{
    var k=ks[lv];
    if(S[k]===key){S[k]=null;for(var i=lv+1;i<ks.length;i++)S[ks[i]]=null}
    else{S[k]=key;for(var i=lv+1;i<ks.length;i++)S[ks[i]]=null}
  }
  up();
}

function openFS(url){
  var fs=document.getElementById('fs');
  updateFSClass();
  document.getElementById('fsImg').src=url;
  fs.style.display='flex';
  // Copy to clipboard (never block on failure)
  tryCopy(url);
}

function tryCopy(url){
  try{
    var img=new Image();img.crossOrigin='anonymous';
    img.onload=function(){
      try{
        var c=document.createElement('canvas');
        c.width=img.naturalWidth;c.height=img.naturalHeight;
        c.getContext('2d').drawImage(img,0,0);
        c.toBlob(function(blob){
          if(!blob)return;
          try{
            var CI=window.ClipboardItem||ClipboardItem;
            navigator.clipboard.write([new CI({'image/png':blob})]).then(function(){toast('Imagen copiada')}).catch(function(){});
          }catch(e){}
        },'image/png');
      }catch(e){}
    };
    img.onerror=function(){};
    img.src=url;
  }catch(e){}
}

function toast(m){
  var t=document.getElementById('toast');
  t.textContent=m;t.classList.add('on');
  clearTimeout(t._tid);t._tid=setTimeout(function(){t.classList.remove('on')},1800);
}

function up(){mkCrumb();mkSecs();mkGrid();}

function md(t){if(!t)return'';t=t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');t=t.replace(/^### (.+)$/gm,'<h3>$1</h3>');t=t.replace(/^## (.+)$/gm,'<h2>$1</h2>');t=t.replace(/^# (.+)$/gm,'<h1>$1</h1>');t=t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');t=t.replace(/\*([^*]+)\*/g,'<em>$1</em>');t=t.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');t=t.replace(/^[\s\-*]{3,}$/gm,'<hr>');t=t.replace(/^\* (.+)$/gm,'<li>$1</li>');t=t.replace(/((?:<li>.*<\/li>\n?)+)/g,'<ul>$1</ul>');return t}
